version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: eduverse
      POSTGRES_PASSWORD: eduverse_pass
      POSTGRES_DB: eduverse
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  judge0:
    image: judge0/judge0:latest
    ports:
      - "2358:2358"
    environment:
      JUDGE0_HOSTNAME: "http://localhost:2358"
    privileged: true

volumes:
  pgdata:

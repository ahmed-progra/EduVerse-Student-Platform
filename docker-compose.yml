services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: eduverse
      POSTGRES_PASSWORD: eduverse_pass
      POSTGRES_DB: eduverse
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eduverse"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  judge0:
    image: judge0/judge0:1.13.1
    ports:
      - "2358:2358"
    environment:
      JUDGE0_HOSTNAME: "http://localhost:2358"
    privileged: true
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:2358/info"]
      interval: 15s
      timeout: 10s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata:

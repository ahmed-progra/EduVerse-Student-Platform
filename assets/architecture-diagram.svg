<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="900" y2="620" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
    <linearGradient id="frontendBox" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="backendBox" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f3460"/>
      <stop offset="100%" stop-color="#0a1628"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>
  <rect width="900" height="620" fill="url(#bg)" rx="8"/>

  <!-- Title -->
  <text x="450" y="35" text-anchor="middle" fill="#f59e0b" font-family="system-ui, sans-serif" font-size="20" font-weight="700">EduVerse Architecture</text>

  <!-- Frontend block -->
  <rect x="50" y="60" width="370" height="240" rx="6" fill="url(#frontendBox)" stroke="#334155" stroke-width="1.5"/>
  <text x="235" y="85" text-anchor="middle" fill="#f59e0b" font-family="system-ui, sans-serif" font-size="14" font-weight="600">FRONTEND — Next.js 16 App Router</text>
  <line x1="60" y1="95" x2="410" y2="95" stroke="#334155" stroke-width="1"/>

  <text x="70" y="118" fill="#94a3b8" font-family="monospace, sans-serif" font-size="11">src/app/</text>
  <text x="70" y="138" fill="#64748b" font-family="monospace, sans-serif" font-size="10">dashboard   courses   lessons   lab   codelab</text>
  <text x="70" y="153" fill="#64748b" font-family="monospace, sans-serif" font-size="10">mentor   apprentice   projects   battle</text>
  <text x="70" y="168" fill="#64748b" font-family="monospace, sans-serif" font-size="10">leaderboard   shop   skill-tree</text>

  <text x="70" y="195" fill="#94a3b8" font-family="monospace, sans-serif" font-size="11">src/components/</text>
  <text x="70" y="215" fill="#64748b" font-family="monospace, sans-serif" font-size="10">layout/ (app-layout, command-palette, AI panels)</text>
  <text x="70" y="230" fill="#64748b" font-family="monospace, sans-serif" font-size="10">ui/ (glass-card, gradient-button, confetti, skeleton)</text>

  <text x="70" y="255" fill="#94a3b8" font-family="monospace, sans-serif" font-size="11">src/features/</text>
  <text x="70" y="275" fill="#64748b" font-family="monospace, sans-serif" font-size="10">lab/ (Three.js)   mentor/   visualizer/   learning/</text>
  <text x="70" y="290" fill="#64748b" font-family="monospace, sans-serif" font-size="10">services/api-client.ts   stores/auth-store.ts</text>

  <!-- Connection arrow: Frontend → Backend -->
  <line x1="235" y1="300" x2="235" y2="340" stroke="#475569" stroke-width="2"/>
  <polygon points="230,335 235,348 240,335" fill="#475569"/>
  <text x="250" y="325" fill="#64748b" font-family="monospace, sans-serif" font-size="9">REST API (JWT)</text>

  <!-- Backend block -->
  <rect x="50" y="350" width="370" height="240" rx="6" fill="url(#backendBox)" stroke="#1e40af" stroke-width="1.5"/>
  <text x="235" y="375" text-anchor="middle" fill="#f59e0b" font-family="system-ui, sans-serif" font-size="14" font-weight="600">BACKEND — Express 5 API</text>
  <line x1="60" y1="385" x2="410" y2="385" stroke="#1e40af" stroke-width="1"/>

  <text x="70" y="408" fill="#94a3b8" font-family="monospace, sans-serif" font-size="11">14 Route Groups</text>
  <text x="70" y="428" fill="#64748b" font-family="monospace, sans-serif" font-size="10">auth   courses   lessons   ai   learning   mentor</text>
  <text x="70" y="443" fill="#64748b" font-family="monospace, sans-serif" font-size="10">apprentice   projects   battles   leaderboard</text>

  <text x="70" y="470" fill="#94a3b8" font-family="monospace, sans-serif" font-size="11">Services</text>
  <text x="70" y="490" fill="#64748b" font-family="monospace, sans-serif" font-size="10">ai-service   learning-service   mentor-service</text>
  <text x="70" y="505" fill="#64748b" font-family="monospace, sans-serif" font-size="10">apprentice-service   project-service   xp-service</text>

  <text x="70" y="532" fill="#94a3b8" font-family="monospace, sans-serif" font-size="11">Middleware</text>
  <text x="70" y="552" fill="#64748b" font-family="monospace, sans-serif" font-size="10">auth (JWT)   rate-limit (api, auth, ai, code)</text>
  <text x="70" y="572" fill="#64748b" font-family="monospace, sans-serif" font-size="10">Prisma ORM   PostgreSQL (Supabase)</text>

  <!-- External services block -->
  <rect x="480" y="60" width="380" height="530" rx="6" fill="url(#frontendBox)" stroke="#334155" stroke-width="1.5"/>
  <text x="670" y="85" text-anchor="middle" fill="#f59e0b" font-family="system-ui, sans-serif" font-size="14" font-weight="600">EXTERNAL SERVICES</text>
  <line x1="490" y1="95" x2="850" y2="95" stroke="#334155" stroke-width="1"/>

  <!-- Database -->
  <rect x="510" y="115" width="320" height="80" rx="4" fill="#0a1628" stroke="#2563eb" stroke-width="1.5"/>
  <text x="670" y="140" text-anchor="middle" fill="#60a5fa" font-family="system-ui, sans-serif" font-size="13" font-weight="600">PostgreSQL (Supabase)</text>
  <text x="670" y="160" text-anchor="middle" fill="#64748b" font-family="system-ui, sans-serif" font-size="10">21 models · 7 courses · 172 lessons</text>
  <text x="670" y="177" text-anchor="middle" fill="#64748b" font-family="system-ui, sans-serif" font-size="10">User · Course · Lesson · Progress · Mentor · Project</text>

  <!-- Arrow: Backend to Database -->
  <line x1="420" y1="460" x2="505" y2="175" stroke="#475569" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="440" y="300" fill="#64748b" font-family="monospace, sans-serif" font-size="9" transform="rotate(-70, 440, 300)">Prisma ORM</text>

  <!-- AI -->
  <rect x="510" y="215" width="320" height="100" rx="4" fill="#0a1628" stroke="#059669" stroke-width="1.5"/>
  <text x="670" y="240" text-anchor="middle" fill="#34d399" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Google AI Studio (Gemini)</text>
  <text x="670" y="260" text-anchor="middle" fill="#64748b" font-family="system-ui, sans-serif" font-size="10">gemini-2.5-flash (default)</text>
  <text x="670" y="277" text-anchor="middle" fill="#64748b" font-family="system-ui, sans-serif" font-size="10">Mentor · Apprentice · Projects · Grading</text>
  <text x="670" y="294" text-anchor="middle" fill="#64748b" font-family="system-ui, sans-serif" font-size="10">Review · Hints · Quiz · Summary · Explain</text>

  <!-- Arrow: Backend to AI -->
  <line x1="420" y1="440" x2="505" y2="270" stroke="#475569" stroke-width="1.5" stroke-dasharray="5,3"/>

  <!-- Judge0 -->
  <rect x="510" y="335" width="320" height="80" rx="4" fill="#0a1628" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="670" y="360" text-anchor="middle" fill="#a78bfa" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Judge0 CE</text>
  <text x="670" y="380" text-anchor="middle" fill="#64748b" font-family="system-ui, sans-serif" font-size="10">Code execution for C++</text>
  <text x="670" y="397" text-anchor="middle" fill="#64748b" font-family="system-ui, sans-serif" font-size="10">Isolated sandbox environment</text>

  <!-- Arrow: Backend to Judge0 -->
  <line x1="420" y1="480" x2="505" y2="380" stroke="#475569" stroke-width="1.5" stroke-dasharray="5,3"/>

  <!-- Browser -->
  <rect x="510" y="435" width="320" height="70" rx="4" fill="#0a1628" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="670" y="460" text-anchor="middle" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="13" font-weight="600">In-Browser Runtimes</text>
  <text x="670" y="480" text-anchor="middle" fill="#64748b" font-family="system-ui, sans-serif" font-size="10">Skulpt (Python) · sandboxed iframe (HTML/CSS)</text>

  <!-- 3D Lab -->
  <rect x="510" y="520" width="320" height="55" rx="4" fill="#0a1628" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="670" y="545" text-anchor="middle" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Three.js 3D Interactive Lab</text>
  <text x="670" y="562" text-anchor="middle" fill="#64748b" font-family="system-ui, sans-serif" font-size="10">React Three Fiber · Orbit Controls · GLTF Models</text>
</svg>

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Quality check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        node-version: [20, 22]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Type-check (all workspaces)
        run: npm run typecheck

      - name: Unit tests (backend)
        run: npm run test -w backend

      - name: Format check
        run: npm run format:check

      - name: Lint (backend)
        working-directory: backend
        run: npm run lint

      - name: Lint (frontend)
        working-directory: frontend
        run: npm run lint

      - name: Validate Prisma schema
        working-directory: backend
        run: npx prisma validate

      - name: Build (all workspaces)
        run: npm run build

      - name: Run E2E Tests (Backend scripts)
        run: npm run test:e2e -w backend

  security-audit:
    name: Dependency security audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # Fails only on high/critical advisories. Known moderate advisories are
      # transitive (monaco-editor's bundled dompurify, Next's bundled postcss)
      # and cannot be resolved without breaking-change downgrades — see SECURITY.md.
      - name: npm audit (high and above)
        run: npm audit --audit-level=high
